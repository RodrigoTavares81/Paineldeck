<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../../"><!-- caminhos do deck.json (capas "games/x.jpg") são relativos ao wwwroot -->
  <title>PainelDeck · Navy</title>
  <link rel="stylesheet" href="overlays.css"><!-- roda de jogos, gaveta de macros, diálogo do ✨ Claude -->
  <link rel="stylesheet" href="scenes/navy/navy.css">
</head>
<body>
  <div id="sky"><div class="glow g1"></div><div class="glow g2"></div><div class="dots"></div></div>

  <main id="stage">
    <!-- ===== topo ===== -->
    <header class="top card-in" style="--i:0">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="2" width="6" height="6" rx="1.6"/><rect x="9" y="2" width="6" height="6" rx="1.6"/><rect x="16" y="2" width="6" height="6" rx="1.6" class="hot"/>
          <rect x="2" y="9" width="6" height="6" rx="1.6"/><rect x="9" y="9" width="6" height="6" rx="1.6" class="core"/><rect x="16" y="9" width="6" height="6" rx="1.6"/>
          <rect x="2" y="16" width="6" height="6" rx="1.6" class="hot"/><rect x="9" y="16" width="6" height="6" rx="1.6"/><rect x="16" y="16" width="6" height="6" rx="1.6"/>
        </svg>
        <span class="brand-name">PAINELDECK</span>
        <span class="brand-sub">NAVY</span>
      </div>

      <div class="chips">
        <!-- modo jogo: "JOGANDO · 1h12" (some quando não tem jogo aberto) -->
        <div class="chip playing" id="chip-play" hidden><i class="rec"></i><span>JOGANDO</span><b id="chip-play-time">0min</b></div>
        <!-- atualização: aparece quando tem versão nova no GitHub (2 toques pra instalar) -->
        <button class="chip action update" id="chip-update" hidden title="Atualizar o PainelDeck">
          <svg viewBox="0 0 24 24" class="ico-up"><path d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-2.05-4.95L14 10h7V3l-2.64 2.64A8.97 8.97 0 0 0 12 3Z"/></svg>
          <span id="chip-update-text">Atualizar</span>
        </button>
        <button class="chip action claude" id="btn-claude" title="Pedir uma mudança no painel pro Claude">
          <svg viewBox="0 0 24 24"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9Zm7 12 .9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9Z"/></svg>
          <span>Pedir ao Claude</span>
        </button>
        <button class="chip action" id="btn-rest" title="Modo descanso (Ctrl+Alt+H)">
          <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
          <span>Descansar</span><kbd>Ctrl Alt H</kbd>
        </button>
      </div>

      <div class="clock">
        <div class="time"><span id="hh">--</span><span class="colon">:</span><span id="mm">--</span><span class="ss" id="ss">--</span></div>
        <div class="date" id="date">—</div>
      </div>
    </header>

    <!-- ===== férias (peça principal) ===== -->
    <section class="card hero card-in" style="--i:1" id="hero">
      <div class="scene" aria-hidden="true">
        <div class="stars"></div>
        <div class="sun"></div>
        <svg class="sea" viewBox="0 0 400 120" preserveAspectRatio="none">
          <path class="w1" d="M0 40 Q25 32 50 40 T100 40 T150 40 T200 40 T250 40 T300 40 T350 40 T400 40 T450 40 T500 40 T550 40 T600 40 T650 40 T700 40 T750 40 T800 40 V120 H0Z"/>
          <path class="w2" d="M0 62 Q25 55 50 62 T100 62 T150 62 T200 62 T250 62 T300 62 T350 62 T400 62 T450 62 T500 62 T550 62 T600 62 T650 62 T700 62 T750 62 T800 62 V120 H0Z"/>
          <path class="w3" d="M0 86 Q25 80 50 86 T100 86 T150 86 T200 86 T250 86 T300 86 T350 86 T400 86 T450 86 T500 86 T550 86 T600 86 T650 86 T700 86 T750 86 T800 86 V120 H0Z"/>
        </svg>
      </div>
      <div class="hero-body">
        <div class="kicker" id="hero-kicker">CONTAGEM REGRESSIVA</div>
        <div class="big"><span class="num" id="hero-num">-</span><span class="unit" id="hero-unit">dias</span></div>
        <div class="caption" id="hero-caption">pras férias</div>
        <div class="timer" id="hero-timer">--h --m --s</div>
        <div class="timeline">
          <div class="now-tag" id="hero-tag">HOJE</div>
          <div class="track"><div class="fill" id="hero-fill"></div><div class="tick" id="hero-tick"></div><div class="now" id="hero-now"></div></div>
          <div class="marks">
            <span class="m1" id="hero-m1"><b id="hero-d1">--</b>férias</span>
            <span class="m2"><b id="hero-d2">--</b>volta</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== modo jogo: entra no lugar das férias quando um jogo abre ===== -->
    <section class="card gamehero swap" id="gamehero">
      <div class="g-art" id="g-art"></div>
      <div class="g-body">
        <div class="kicker"><i class="rec"></i><span id="g-kicker">JOGANDO AGORA</span><span class="paused" id="g-paused">PAUSADO</span></div>
        <div class="g-name" id="g-name">—</div>
        <div class="g-fps" id="g-fps"><span class="num" id="g-fps-num">--</span><span class="unit">FPS</span></div>
        <div class="g-fps-sub" id="g-fps-sub">&nbsp;</div>
        <svg class="g-spark" id="g-spark" viewBox="0 0 300 70" preserveAspectRatio="none">
          <defs><linearGradient id="g-spark-fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8fb0ff" stop-opacity=".35"/><stop offset="1" stop-color="#8fb0ff" stop-opacity="0"/></linearGradient></defs>
          <path class="area" d=""/><path class="line" d=""/><circle class="head" r="3.5" cx="-10" cy="-10"/>
        </svg>
        <div class="g-stats">
          <div><span class="k">SESSÃO</span><b id="g-session">0:00:00</b></div>
          <div><span class="k">CPU</span><b id="g-cpu">--°</b></div>
          <div><span class="k">GPU</span><b id="g-gpu">--°</b></div>
        </div>
      </div>
    </section>

    <!-- ===== jogos (vem do deck.json, seção "games") ===== -->
    <section class="card games card-in" style="--i:2">
      <div class="card-head">
        <span class="label">JOGAR</span>
        <button class="head-btn" id="games-all" title="Abrir a roda com todos os jogos">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 4a2 2 0 1 1-2 2 2 2 0 0 1 2-2ZM6 12a2 2 0 1 1 2 2 2 2 0 0 1-2-2Zm6 6a2 2 0 1 1 2-2 2 2 0 0 1-2 2Zm4-4a2 2 0 1 1 2-2 2 2 0 0 1-2 2Z"/></svg>
          <span>roda</span>
        </button>
      </div>
      <div class="shelf" id="shelf"></div>
    </section>

    <!-- ===== notícias de IA (C# busca o RSS, Bridge.call("news")) ===== -->
    <section class="card news card-in" style="--i:3">
      <div class="card-head">
        <span class="label" id="news-label">IA · NOTÍCIAS</span>
        <span class="news-side"><span class="pager" id="pager"></span><span class="upd" id="news-upd"></span></span>
      </div>
      <div class="feed-wrap"><ol class="feed" id="feed"></ol></div>
    </section>

    <!-- ===== telemetria + dados do PC ===== -->
    <section class="card telemetry card-in" style="--i:4">
      <div class="card-head"><span class="label">TELEMETRIA</span><span class="live"><i></i>ao vivo</span></div>
      <div class="tele-body">
        <div class="gauges">
          <div class="gauge" data-metric="cpu"></div>
          <div class="gauge" data-metric="gpu"></div>
          <div class="gauge" data-metric="ram"></div>
          <div class="gauge" data-metric="vram"></div>
        </div>
        <div class="sys">
          <div class="stat" id="st-up">
            <span class="k">LIGADO HÁ</span>
            <b class="v" id="st-up-v">--</b>
            <span class="s" id="st-up-s">&nbsp;</span>
          </div>
          <div class="stat" id="st-net">
            <span class="k">REDE</span>
            <b class="v"><i class="arw dn">↓</i><span id="st-net-down">--</span></b>
            <span class="s"><i class="arw">↑</i><span id="st-net-up">--</span></span>
            <svg class="spark" viewBox="0 0 120 30" preserveAspectRatio="none"><path class="area" d=""/><path class="line" d=""/></svg>
          </div>
          <div class="stat" id="st-disk">
            <span class="k">DISCO</span>
            <b class="v" id="st-disk-v">--</b>
            <span class="s" id="st-disk-s">&nbsp;</span>
          </div>
          <div class="stat" id="st-drives">
            <span class="k">ESPAÇO</span>
            <div class="drives" id="st-drives-list"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast"></div>

  <!-- o app.js do clássico desenha o deck aqui (escondido): games/macros/editor dependem dele (App.deck, App.toast) -->
  <div id="classic" hidden><main id="grid"></main><nav id="tabs"></nav></div>

  <script src="bridge.js"></script>
  <script>window.Widgets = {}; // widgets do clássico não aparecem no Navy: não monta nenhum na grade escondida</script>
  <script src="games.js"></script>
  <script src="macros.js"></script>
  <script src="app.js"></script>
  <script src="editor.js"></script>
  <script src="scenes/navy/navy.js"></script>
</body>
</html>
